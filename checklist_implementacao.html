<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plano de Implementação — Rodrigo Ramos Audiovisual</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0f14;
            --surface: #161a23;
            --surface2: #1e2330;
            --border: #2a3045;
            --text: #e8eaf0;
            --muted: #6b7494;
            --red: #ff4757;
            --orange: #ffa502;
            --green: #2ed573;
            --blue: #5352ed;
            --gold: #ffd700;
            --accent: #7c6af7;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 24px 16px 60px;
        }
        .header {
            max-width: 800px;
            margin: 0 auto 40px;
        }
        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(124, 106, 247, 0.15);
            border: 1px solid rgba(124, 106, 247, 0.3);
            color: var(--accent);
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 28px;
            font-weight: 800;
            color: var(--text);
            line-height: 1.2;
            margin-bottom: 8px;
        }
        h1 span { color: var(--accent); }
        .subtitle {
            color: var(--muted);
            font-size: 14px;
        }
        .global-progress {
            max-width: 800px;
            margin: 0 auto 32px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px 24px;
        }
        .global-progress-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .global-progress-top span:first-child {
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .global-pct {
            font-size: 24px;
            font-weight: 800;
            color: var(--accent);
        }
        .progress-bar-wrap {
            height: 8px;
            background: var(--border);
            border-radius: 100px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), #a78bfa);
            border-radius: 100px;
            transition: width 0.5s ease;
        }
        .phases {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .phase-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
        }
        .phase-header {
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            user-select: none;
        }
        .phase-dot {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }
        .phase-dot.red { background: rgba(255, 71, 87, 0.15); }
        .phase-dot.orange { background: rgba(255, 165, 2, 0.15); }
        .phase-dot.green { background: rgba(46, 213, 115, 0.15); }
        .phase-dot.blue { background: rgba(83, 82, 237, 0.15); }
        .phase-meta { flex: 1; }
        .phase-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .phase-label.red { color: var(--red); }
        .phase-label.orange { color: var(--orange); }
        .phase-label.green { color: var(--green); }
        .phase-label.blue { color: var(--blue); }
        .phase-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
        }
        .phase-subtitle {
            font-size: 12px;
            color: var(--muted);
            margin-top: 2px;
        }
        .phase-progress-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .phase-pct {
            font-size: 13px;
            font-weight: 700;
            color: var(--muted);
            min-width: 36px;
            text-align: right;
        }
        .mini-bar {
            width: 80px;
            height: 6px;
            background: var(--border);
            border-radius: 100px;
            overflow: hidden;
        }
        .mini-bar-fill {
            height: 100%;
            border-radius: 100px;
            transition: width 0.4s ease;
        }
        .mini-bar-fill.red { background: var(--red); }
        .mini-bar-fill.orange { background: var(--orange); }
        .mini-bar-fill.green { background: var(--green); }
        .mini-bar-fill.blue { background: var(--blue); }
        .phase-body {
            border-top: 1px solid var(--border);
        }
        .action-group {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
        }
        .action-group:last-child { border-bottom: none; }
        .action-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .action-title::before {
            content: '';
            display: block;
            width: 3px;
            height: 14px;
            border-radius: 2px;
        }
        .action-title.red::before { background: var(--red); }
        .action-title.orange::before { background: var(--orange); }
        .action-title.green::before { background: var(--green); }
        .action-title.blue::before { background: var(--blue); }
        .task {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 10px 0;
            cursor: pointer;
            border-radius: 10px;
            transition: background 0.15s;
        }
        .task:hover { background: rgba(255,255,255,0.03); padding-left: 8px; margin-left: -8px; }
        .checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-radius: 6px;
            flex-shrink: 0;
            margin-top: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .task.done .checkbox {
            border-color: var(--green);
            background: var(--green);
        }
        .task.done .checkbox::after {
            content: '';
            display: block;
            width: 5px;
            height: 9px;
            border: 2px solid #0d0f14;
            border-top: none;
            border-left: none;
            transform: rotate(45deg) translateY(-1px);
        }
        .task-text {
            font-size: 14px;
            color: var(--text);
            line-height: 1.5;
            transition: color 0.2s;
        }
        .task.done .task-text {
            color: var(--muted);
            text-decoration: line-through;
        }
        .success-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(46, 213, 115, 0.1);
            border: 1px solid rgba(46, 213, 115, 0.25);
            color: var(--green);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 12px;
        }
        .reset-btn {
            display: block;
            margin: 40px auto 0;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 10px 24px;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }
        .reset-btn:hover {
            border-color: var(--red);
            color: var(--red);
        }
        .completed-phase .phase-header {
            opacity: 0.7;
        }
    </style>
</head>
<body>

function loadState() {
    const s = localStorage.getItem('rrAudiovisual_plan');
    return s ? JSON.parse(s) : {};
}
function saveState(state) {
    localStorage.setItem('rrAudiovisual_plan', JSON.stringify(state));
}

let state = loadState();

// Pre-mark the confirmed done item
if (!('t7' in state)) { state.t7 = true; saveState(state); }

function countTasks() {
    let total = 0, done = 0;
    data.forEach(phase => phase.actions.forEach(a => a.tasks.forEach(t => {
        total++;
        if (state[t.id]) done++;
    })));
    return { total, done };
}

function countPhase(phase) {
    let total = 0, done = 0;
    phase.actions.forEach(a => a.tasks.forEach(t => {
        total++;
        if (state[t.id]) done++;
    }));
    return { total, done };
}

function updateGlobal() {
    const { total, done } = countTasks();
    const pct = total > 0 ? Math.round((done / total) * 100) : 0;
    document.getElementById('globalPct').textContent = pct + '%';
    document.getElementById('globalBar').style.width = pct + '%';
}

function render() {

                    <div class="task ${state[t.id] ? 'done' : ''}" onclick="toggle('${t.id}')" id="task_${t.id}">
                        <div class="checkbox"></div>
                        <span class="task-text">${t.text}</span>
                    </div>
                `).join('')}
            </div>
        `).join('');

        card.innerHTML = `
            <div class="phase-header">
                <div class="phase-dot ${phase.color}">${phase.emoji}</div>
                <div class="phase-meta">
                    <div class="phase-label ${phase.color}">${phase.label}</div>
                    <div class="phase-title">${phase.title}</div>
                    <div class="phase-subtitle">${phase.subtitle}</div>
                </div>
                <div class="phase-progress-wrap">
                    <div class="mini-bar">
                        <div class="mini-bar-fill ${phase.color}" style="width:${pct}%"></div>
                    </div>
                    <div class="phase-pct">${done}/${total}</div>
                </div>
            </div>
            <div class="phase-body">${actionsHTML}</div>
        `;
        container.appendChild(card);
    });
    updateGlobal();
}

function toggle(taskId) {
    state[taskId] = !state[taskId];
    saveState(state);
    const taskEl = document.getElementById('task_' + taskId);
    if (state[taskId]) {
        taskEl.classList.add('done');
    } else {
        taskEl.classList.remove('done');
    }
    // update phase progress
    render();
}

function resetAll() {
    if (confirm('Tem certeza que quer reiniciar todo o progresso?')) {
        state = {};
        saveState(state);
        render();
    }
}

render();
</script>
</body>
</html>
